<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="ZIG — Smart Multi-Stop Route Optimizer & Real-Time Voice Navigation" />
  <title>ZIG — Smart Route & Voice Navigation</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div id="map" role="region" aria-label="Interactive Map"></div>
  <div id="toastBanner" class="toast-banner" role="status" aria-live="polite"></div>

  <!-- Nearby Category Pills (Works Both Before & During Navigation) -->
  <div class="category-bar" id="categoryBar" role="toolbar" aria-label="Nearby Places">
    <button class="cat-chip" data-tag="amenity:fuel" data-icon="⛽" aria-label="Search nearby gas stations">⛽ Gas</button>
    <button class="cat-chip" data-tag="amenity:charging_station" data-icon="⚡" aria-label="Search nearby EV chargers">⚡ EV Charge</button>
    <button class="cat-chip" data-tag="amenity:cafe" data-icon="☕" aria-label="Search nearby coffee shops">☕ Coffee</button>
    <button class="cat-chip" data-tag="amenity:restaurant" data-icon="🍴" aria-label="Search nearby restaurants">🍴 Food</button>
    <button class="cat-chip" data-tag="shop:supermarket" data-icon="🛒" aria-label="Search nearby grocery stores">🛒 Grocery</button>
    <button class="cat-chip" data-tag="amenity:parking" data-icon="🅿️" aria-label="Search nearby parking">🅿️ Parking</button>
    <button class="cat-chip" data-tag="amenity:hospital" data-icon="🏥" aria-label="Search nearby hospitals">🏥 Hospital</button>
  </div>

  <!-- Map Layer Switcher -->
  <div class="layer-switcher" id="layerSwitcher" role="group" aria-label="Map Layer Selector">
    <button class="layer-btn active" data-layer="streets" aria-label="Streets Layer">Map</button>
    <button class="layer-btn" data-layer="dark" aria-label="Dark Mode Layer">Dark</button>
    <button class="layer-btn" data-layer="satellite" aria-label="Satellite Imagery Layer">Satellite</button>
  </div>

  <!-- Active Voice Navigation Top HUD -->
  <div id="navHudTop" class="nav-hud-top" role="region" aria-label="Navigation Guidance Banner">
    <div class="nav-hud-main">
      <div class="nav-turn-icon" id="navTurnIcon" aria-hidden="true"></div>
      <div class="nav-instruction-block">
        <div class="nav-step-dist" id="navStepDist">Calculating...</div>
        <div class="nav-step-text" id="navStepText">Follow route</div>
      </div>
    </div>
    <div class="nav-hud-sub">
      <span id="navNextStopLabel">Next stop: --</span>
      <span id="navStopCounter">Stop 1 of --</span>
    </div>
  </div>

  <!-- Mid-Navigation "Add Stop" Search Modal -->
  <div id="navAddStopModal" class="nav-add-stop-modal" role="dialog" aria-modal="true" aria-label="Add stop along route">
    <div class="nav-add-stop-header">
      <span>Add stop along route</span>
      <button id="closeNavAddStopBtn" class="close-sheet-btn" aria-label="Close dialog">&times;</button>
    </div>
    <div class="input-row">
      <input type="text" id="navStopSearchInput" class="g-input" placeholder="Search gas, coffee, address..." autocomplete="off" aria-label="Search detour address" />
    </div>
    <div id="navStopDropdown" class="nav-stop-results" role="listbox"></div>
  </div>

  <!-- Demo Drive Playback Controls Pill (1x through 100x) -->
  <div id="demoControlsBar" class="demo-controls-bar" role="toolbar" aria-label="Demo Drive Playback Controls">
    <button id="demoPlayPauseBtn" class="demo-ctrl-btn" title="Pause / Resume" aria-label="Pause or resume demo drive">⏸</button>
    <button class="demo-speed-btn active" data-mult="1" aria-label="Speed 1x">1x</button>
    <button class="demo-speed-btn" data-mult="2" aria-label="Speed 2x">2x</button>
    <button class="demo-speed-btn" data-mult="5" aria-label="Speed 5x">5x</button>
    <button class="demo-speed-btn" data-mult="10" aria-label="Speed 10x">10x</button>
    <button class="demo-speed-btn" data-mult="20" aria-label="Speed 20x">20x</button>
    <button class="demo-speed-btn" data-mult="30" aria-label="Speed 30x">30x</button>
    <button class="demo-speed-btn" data-mult="40" aria-label="Speed 40x">40x</button>
    <button class="demo-speed-btn" data-mult="50" aria-label="Speed 50x">50x</button>
    <button class="demo-speed-btn" data-mult="100" aria-label="Speed 100x">100x</button>
    <button id="demoSkipStopBtn" class="demo-ctrl-btn" title="Jump to next stop" aria-label="Skip to next stop">⏭</button>
  </div>

  <!-- Live Speedometer Pill -->
  <div id="speedPill" class="speed-pill" role="status" aria-label="Current Vehicle Speed">
    <span class="speed-val" id="speedVal">0</span>
    <span class="speed-unit" id="speedUnit">MPH</span>
  </div>

  <!-- Active Voice Navigation Bottom Bar -->
  <div id="navHudBottom" class="nav-hud-bottom" role="region" aria-label="Trip Progress Controls">
    <div class="nav-eta-group">
      <div class="nav-eta-main" id="navRemainingTime">-- min</div>
      <div class="nav-eta-sub" id="navRemainingDist">-- mi remaining</div>
    </div>
    <div class="nav-controls-group">
      <button id="navAddStopBtn" class="circle-control-btn" title="Add Stop Along Route" aria-label="Add stop along route">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#1a73e8" aria-hidden="true">
          <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
        </svg>
      </button>
      <button id="navMicBtn" class="circle-control-btn" title="Voice Command" aria-label="Voice Command Mic">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/>
        </svg>
      </button>
      <button id="voiceToggleBtn" class="circle-control-btn" title="Mute/Unmute Voice" aria-label="Mute or Unmute Voice Guidance">
        <svg id="voiceOnIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
        </svg>
        <svg id="voiceOffIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="display:none;" aria-hidden="true">
          <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
        </svg>
      </button>
      <button id="recenterBtn" class="circle-control-btn" title="Recenter on Vehicle" aria-label="Recenter map on vehicle">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#1a73e8" aria-hidden="true">
          <path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3A8.994 8.994 0 0 0 13 3.06V1h-2v2.06A8.994 8.994 0 0 0 3.06 11H1v2h2.06A8.994 8.994 0 0 0 11 20.94V23h2v-2.06A8.994 8.994 0 0 0 20.94 13H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/>
        </svg>
      </button>
      <button id="exitNavBtn" class="exit-nav-btn" aria-label="Exit Navigation">Exit</button>
    </div>
  </div>

  <!-- Floating Report Incident Button -->
  <button id="reportFab" class="report-fab" title="Report road incident" aria-label="Report road incident">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="#1a73e8" aria-hidden="true">
      <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-7 9h-2V5h2v6zm0 4h-2v-2h2v2z"/>
    </svg>
  </button>

  <!-- Incident Report Picker -->
  <div id="reportSheet" class="report-sheet" role="dialog" aria-modal="true" aria-label="Report road incident picker">
    <div class="report-sheet-header">
      <span>Report on route</span>
      <button id="closeReportBtn" class="close-sheet-btn" aria-label="Close report dialog">&times;</button>
    </div>
    <div class="report-grid">
      <button class="report-option" data-type="police" data-label="Police / Speed trap" aria-label="Report Police or Speed Trap">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="#1a73e8" aria-hidden="true"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
        Police
      </button>
      <button class="report-option" data-type="object" data-label="Object on road" aria-label="Report Object on Road">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="#f29900" aria-hidden="true"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>
        Object on road
      </button>
      <button class="report-option" data-type="crash" data-label="Crash reported" aria-label="Report Vehicle Crash">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="#d93025" aria-hidden="true"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
        Crash
      </button>
      <button class="report-option" data-type="slowdown" data-label="Heavy slowdown" aria-label="Report Traffic Slowdown">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="#d93025" aria-hidden="true"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
        Slowdown
      </button>
    </div>
  </div>

  <!-- Main Route Planning Panel -->
  <div id="directionsPanel" class="directions-panel" role="region" aria-label="Route Planning Panel">
    <div class="panel-header">
      <div class="mode-tabs" role="tablist" aria-label="Travel Modes">
        <div class="brand-mark"><span class="brand-dot"></span>ZIG</div>
        <button class="travel-mode-btn active" data-mode="driving" data-avatar="sedan" title="Car" aria-label="Travel mode: Car">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"/></svg>
        </button>
        <button class="travel-mode-btn" data-mode="moto" data-avatar="bike" title="Motorcycle" aria-label="Travel mode: Motorcycle">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19.44 9.03L15.41 5H11v2h3.59l2 2H5c-2.8 0-5 2.2-5 5s2.2 5 5 5c2.46 0 4.45-1.69 4.9-4h1.65l2.77-2.77c-.21.54-.32 1.14-.32 1.77 0 2.8 2.2 5 5 5s5-2.2 5-5c0-2.65-1.97-4.77-4.56-4.97zM5 17c-1.65 0-3-1.35-3-3s1.35-3 3-3 3 1.35 3 3-1.35 3-3 3zm14 0c-1.65 0-3-1.35-3-3s1.35-3 3-3 3 1.35 3 3-1.35 3-3 3z"/></svg>
        </button>
        <button class="travel-mode-btn" data-mode="cycling" data-avatar="bicycle" title="Bicycle" aria-label="Travel mode: Bicycle">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M15.5 5.5c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zM5 12c-2.8 0-5 2.2-5 5s2.2 5 5 5 5-2.2 5-5-2.2-5-5-5zm0 8.5c-1.9 0-3.5-1.6-3.5-3.5s1.6-3.5 3.5-3.5 3.5 1.6 3.5 3.5-1.6 3.5-3.5 3.5zm5.8-10l2.4-2.4.8.8c1.3 1.3 3 2.1 5.1 2.1V9c-1.5 0-2.7-.6-3.6-1.5l-1.9-1.9c-.5-.4-1-.6-1.6-.6s-1.1.2-1.4.6L7.8 8.4c-.4.4-.6.9-.6 1.4 0 .6.2 1.1.6 1.4L11 14v5h2v-6.2l-2.2-2.3zM19 12c-2.8 0-5 2.2-5 5s2.2 5 5 5 5-2.2 5-5-2.2-5-5-5zm0 8.5c-1.9 0-3.5-1.6-3.5-3.5s1.6-3.5 3.5-3.5 3.5 1.6 3.5 3.5-1.6 3.5-3.5 3.5z"/></svg>
        </button>
        <button class="travel-mode-btn" data-mode="walking" data-avatar="walk" title="Walking" aria-label="Travel mode: Walking">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.5 5.5c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zM9.8 8.9L7 23h2.1l1.8-8 2.1 2v6h2v-7.5l-2.1-2 .6-3C14.8 12 16.8 13 19 13v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1L6 8.3V13h2V9.6l1.8-.7"/></svg>
        </button>
      </div>

      <div class="header-right">
        <button id="optionsToggleBtn" class="icon-action-btn" aria-label="Toggle Options Drawer">
          Options
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M7 10l5 5 5-5z"/>
          </svg>
        </button>
        <button id="clearAllBtn" class="icon-action-btn" style="display:none;" aria-label="Clear All Stops">Clear</button>
      </div>
    </div>

    <!-- Collapsible Options Drawer -->
    <div id="optionsDrawer" class="options-drawer" role="region" aria-label="Optimization Settings">
      <div>
        <div class="option-group-label">Optimize By</div>
        <div class="segmented-row" id="goalSelector" role="group" aria-label="Optimization Goal">
          <button type="button" class="seg-btn active" data-goal="time" aria-label="Fastest time">Fastest time</button>
          <button type="button" class="seg-btn" data-goal="distance" aria-label="Shortest distance">Shortest dist.</button>
          <button type="button" class="seg-btn eco" data-goal="fuel" aria-label="Fuel-efficient">Fuel-efficient</button>
        </div>
      </div>

      <div>
        <div class="option-group-label">Destination Rule</div>
        <div class="segmented-row" id="endRuleSelector" role="group" aria-label="Destination Rule">
          <button type="button" class="seg-btn active" data-end="any" aria-label="Auto end anywhere">Auto end</button>
          <button type="button" class="seg-btn" data-end="roundtrip" aria-label="Round trip to start">Round trip</button>
          <button type="button" class="seg-btn" data-end="last" aria-label="Fix last stop as final destination">Fix last stop</button>
        </div>
      </div>

      <div>
        <div class="option-group-label">Navigation Avatar</div>
        <div class="avatar-grid" id="avatarSelector" role="group" aria-label="Vehicle Avatar Selector">
          <button type="button" class="seg-btn active" data-avatar="arrow" aria-label="Arrow avatar">Arrow</button>
          <button type="button" class="seg-btn" data-avatar="sedan" aria-label="Sedan avatar">Sedan</button>
          <button type="button" class="seg-btn" data-avatar="suv" aria-label="SUV avatar">SUV</button>
          <button type="button" class="seg-btn" data-avatar="truck" aria-label="Truck avatar">Truck</button>
          <button type="button" class="seg-btn" data-avatar="bike" aria-label="Motorcycle avatar">Moto</button>
        </div>
      </div>

      <div class="fuel-inputs-row" id="fuelConfigRow">
        <div class="mini-field">
          <label for="unitSelect">Units</label>
          <select id="unitSelect" aria-label="Measurement Units">
            <option value="imperial" selected>Miles (MPG)</option>
            <option value="metric">Kilometers (L/100km)</option>
          </select>
        </div>
        <div class="mini-field">
          <label id="effLabel" for="fuelEffInput">Vehicle MPG</label>
          <input type="number" id="fuelEffInput" value="28" min="1" max="200" step="1" aria-label="Vehicle Fuel Efficiency" />
        </div>
        <div class="mini-field">
          <label id="priceLabel" for="fuelPriceInput">Fuel ($/gal)</label>
          <input type="number" id="fuelPriceInput" value="3.25" min="0" max="50" step="0.05" aria-label="Fuel Price" />
        </div>
      </div>
    </div>

    <!-- Draggable Stops Timeline -->
    <div id="stopsContainer" class="stops-container" style="display:none;" role="list" aria-label="Stops List"></div>

    <!-- Search Input + Voice Command Mic -->
    <div class="search-section">
      <div class="input-row">
        <div class="plus-circle" aria-hidden="true">+</div>
        <input type="text" id="searchInput" class="g-input" placeholder="Choose starting point..." autocomplete="off" aria-label="Search address or destination" />
        <button id="voiceCmdBtn" class="gps-btn" title="Voice command" aria-label="Voice Command Microphone">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/>
          </svg>
        </button>
        <button id="gpsBtn" class="gps-btn" title="Use my current location" aria-label="Use Current GPS Location">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm8.94 3A8.994 8.994 0 0 0 13 3.06V1h-2v2.06A8.994 8.994 0 0 0 3.06 11H1v2h2.06A8.994 8.994 0 0 0 11 20.94V23h2v-2.06A8.994 8.994 0 0 0 20.94 13H23v-2h-2.06zM12 19c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/>
          </svg>
        </button>
      </div>
      <div class="helper-hint" id="voiceHintText">Say "Add Target", "Optimize route", or "Take the route"</div>
      <div id="autocompleteDropdown" class="autocomplete-dropdown" role="listbox" aria-label="Autocomplete suggestions"></div>
    </div>

    <!-- Summary Card -->
    <div id="tripSummary" class="trip-summary" role="region" aria-label="Trip Summary">
      <div class="summary-top">
        <div>
          <span id="tripTime" class="trip-time"></span>
          <span id="tripDist" class="trip-dist"></span>
        </div>
        <span id="savingsBadge" class="savings-pill" style="display:none;"></span>
      </div>
      <div class="trip-metrics-row">
        <span id="fuelEstimateText"></span>
        <div class="summary-links">
          <button type="button" id="compareRouteBtn" class="text-link-btn" style="display:none;" aria-label="Toggle Original Route Line">Compare original</button>
          <button type="button" id="toggleStepsPreview" class="text-link-btn" aria-label="Toggle Turn by Turn Steps List">Steps</button>
        </div>
      </div>
      <div id="stepsPreviewList" class="steps-preview-list" role="list" aria-label="Step by step directions"></div>
    </div>

    <!-- Footer Buttons -->
    <div class="panel-footer">
      <div class="btn-row main-actions-row">
        <button id="optimizeBtn" class="btn-primary" disabled aria-label="Optimize Route Sequence">Optimize Route</button>
        <button id="demoDriveBtn" class="btn-secondary" type="button" aria-label="Launch Demo Drive Simulator">Demo Drive</button>
        <button id="startVoiceNavBtn" class="btn-nav-start" type="button" aria-label="Start Voice Navigation">
